<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0314" />
      <stop offset="50%" stop-color="#140628" />
      <stop offset="100%" stop-color="#07020f" />
    </linearGradient>

    <radialGradient id="nebula-purple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9b5de5" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7209b7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a0314" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula-cyan" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#7209b7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07020f" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3e8ff" />
      <stop offset="80%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c770f0" />
      <stop offset="100%" stop-color="#9b5de5" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#9b5de5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a124d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1b0b33" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Card Base -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Nebula Glows -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#nebula-purple)" />
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#nebula-cyan)" />

  <!-- Constellation / Starfield -->
  <g fill="#ffffff">
    <circle cx="85" cy="48" r="1.2" opacity="0.8" />
    <circle cx="140" cy="90" r="1.8" opacity="0.9" />
    <circle cx="210" cy="55" r="1" opacity="0.6" />
    <circle cx="280" cy="110" r="2.2" opacity="0.85" />
    <circle cx="340" cy="45" r="1.4" opacity="0.7" />
    <circle cx="430" cy="80" r="1" opacity="0.5" />
    <circle cx="520" cy="35" r="1.6" opacity="0.75" />
    <circle cx="610" cy="95" r="1.2" opacity="0.6" />
    <circle cx="700" cy="40" r="2" opacity="0.9" />
    <circle cx="790" cy="75" r="1" opacity="0.5" />
    <circle cx="880" cy="50" r="1.8" opacity="0.8" />
    <circle cx="970" cy="90" r="1.3" opacity="0.6" />
    <circle cx="1060" cy="45" r="2.2" opacity="0.85" />
    <circle cx="1130" cy="85" r="1.5" opacity="0.7" />

    <circle cx="60" cy="220" r="1.5" opacity="0.7" />
    <circle cx="120" cy="285" r="2" opacity="0.8" />
    <circle cx="190" cy="240" r="1.2" opacity="0.6" />
    <circle cx="270" cy="300" r="1" opacity="0.5" />
    <circle cx="860" cy="260" r="1.6" opacity="0.7" />
    <circle cx="940" cy="225" r="1.2" opacity="0.6" />
    <circle cx="1020" cy="295" r="2.4" opacity="0.9" />
    <circle cx="1100" cy="240" r="1.5" opacity="0.75" />
    <circle cx="1150" cy="290" r="1" opacity="0.5" />
  </g>

  <!-- Constellation Accent Lines -->
  <path d="M 85 48 L 140 90 L 210 55 L 280 110 M 1020 295 L 1100 240 L 1150 290" stroke="#9b5de5" stroke-opacity="0.25" stroke-width="1" fill="none" />

  <!-- Top Category Eyebrow Pill -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="285" height="30" rx="15" fill="url(#pill-bg)" stroke="#9b5de5" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#a855f7" />
    <text x="28" y="20" fill="#e9d5ff" font-size="12" font-weight="600" letter-spacing="1.5" class="font-mono">PORTFOLIO &amp; HEADLESS CMS</text>
  </g>

  <!-- Version / Live Pulse Badge on Right -->
  <g transform="translate(980, 42)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="url(#pill-bg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#22c55e" />
    <text x="30" y="20" fill="#bae6fd" font-size="12" font-weight="600" letter-spacing="0.5" class="font-mono">ONLINE · v2.0</text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="145" fill="url(#title-grad)" font-size="52" font-weight="800" letter-spacing="-1.5" class="font-sans">Chirag Dhunna</text>

  <!-- Subtitle / Roles -->
  <text x="60" y="185" fill="#e9d5ff" font-size="20" font-weight="500" letter-spacing="0.2" class="font-sans">
    Full-Stack Software Engineer <tspan fill="#9b5de5">·</tspan> AI &amp; Cloud Builder <tspan fill="#9b5de5">·</tspan> Reactive Web Architect
  </text>

  <!-- Description / Pitch -->
  <text x="60" y="218" fill="#a78bfa" font-size="14.5" font-weight="400" class="font-sans">
    React 18 &amp; Vite single-page portfolio powered by a zero-maintenance Git-backed CMS, Cloudflare Workers &amp; automated GitHub Actions.
  </text>

  <!-- Feature Tags / Pills Row -->
  <g transform="translate(60, 255)">
    <!-- Pill 1: React 18 & Vite -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e1038" stroke="#7e22ce" stroke-width="1" />
      <text x="14" y="22" fill="#c084fc" font-size="13" font-weight="600" class="font-sans">⚡ React 18 + Vite</text>
    </g>

    <!-- Pill 2: Git-as-a-Database -->
    <g transform="translate(172, 0)">
      <rect x="0" y="0" width="200" height="34" rx="8" fill="#1e1038" stroke="#7e22ce" stroke-width="1" />
      <text x="14" y="22" fill="#c084fc" font-size="13" font-weight="600" class="font-sans">📦 GitHub-as-a-Database</text>
    </g>

    <!-- Pill 3: Cloudflare Edge Worker -->
    <g transform="translate(384, 0)">
      <rect x="0" y="0" width="205" height="34" rx="8" fill="#1e1038" stroke="#7e22ce" stroke-width="1" />
      <text x="14" y="22" fill="#c084fc" font-size="13" font-weight="600" class="font-sans">🛡️ Cloudflare Edge Worker</text>
    </g>

    <!-- Pill 4: Faceted Public Filters -->
    <g transform="translate(601, 0)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#1e1038" stroke="#7e22ce" stroke-width="1" />
      <text x="14" y="22" fill="#c084fc" font-size="13" font-weight="600" class="font-sans">✨ Faceted Filters (AND)</text>
    </g>

    <!-- Pill 5: Web Crypto JWT Auth -->
    <g transform="translate(808, 0)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#1e1038" stroke="#7e22ce" stroke-width="1" />
      <text x="14" y="22" fill="#c084fc" font-size="13" font-weight="600" class="font-sans">🔐 Web Crypto JWT Auth</text>
    </g>
  </g>
</svg>